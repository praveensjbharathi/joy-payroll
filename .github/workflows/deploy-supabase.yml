name: Deploy Joy Payroll API to Supabase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npm run prepare:supabase
      - name: Check Supabase deployment credential
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN GitHub secret is not configured."
            exit 2
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Deploy payroll API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy payroll-api --project-ref fsiinadrkhsfzuheckbp --use-api
      - name: Deploy employee onboarding
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy employee-onboarding --project-ref fsiinadrkhsfzuheckbp --use-api
      - name: Deploy salary slip mailer
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy salary-slip-mailer --project-ref fsiinadrkhsfzuheckbp --use-api
