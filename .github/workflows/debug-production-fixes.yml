name: Debug Joy Payroll Production Fixes

on:
  push:
    branches:
      - release/production-excellence-v1
    paths-ignore:
      - production-diagnostic/fix-production-tail.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/production-excellence-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Run production patches and capture exact failure
        id: fixes
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run fix:production 2>&1 | tee /tmp/fix-production.log
      - name: Record safe log tail
        shell: bash
        run: |
          mkdir -p production-diagnostic
          tail -n 100 /tmp/fix-production.log > production-diagnostic/fix-production-tail.txt
          printf '\nRESULT=%s\n' '${{ steps.fixes.outcome }}' >> production-diagnostic/fix-production-tail.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production-diagnostic/fix-production-tail.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record production fix diagnostic"
          git push origin HEAD:release/production-excellence-v1
