name: Diagnose Joy Payroll Production

on:
  push:
    branches:
      - release/production-excellence-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Prepare diagnostic directory
        run: mkdir -p production-diagnostic

      - name: Check Cloudflare credential availability
        id: credentials
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo '{"credentials":"available"}' > production-diagnostic/credential-status.json
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo '{"credentials":"missing"}' > production-diagnostic/credential-status.json
          fi

      - name: Read Worker deployment and binding metadata
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl -sS "${auth[@]}" "$base/workers/scripts/joy-payroll/settings" > production-diagnostic/worker-settings.json || true
          curl -sS "${auth[@]}" "$base/workers/scripts/joy-payroll/deployments" > production-diagnostic/worker-deployments.json || true
          curl -sS "${auth[@]}" "$base/d1/database?per_page=100" > production-diagnostic/d1-databases.json || true

      - name: Read-only D1 payroll table counts
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request
          out = pathlib.Path('production-diagnostic')
          token = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          account = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '')
          source = out / 'd1-databases.json'
          report = []
          try:
              payload = json.loads(source.read_text())
              databases = payload.get('result') or []
          except Exception as exc:
              (out / 'd1-counts.json').write_text(json.dumps({'error': str(exc)}, indent=2))
              raise SystemExit(0)
          tables = ['employees', 'payroll_runs', 'payroll_items', 'recovery_finalizations', 'hostels', 'app_users']
          for database in databases:
              dbid = database.get('uuid') or database.get('id')
              name = database.get('name')
              if not dbid:
                  continue
              row = {'database_id': dbid, 'database_name': name, 'counts': {}}
              for table in tables:
                  url = f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{dbid}/query'
                  body = json.dumps({'sql': f'SELECT COUNT(*) AS count FROM {table}'}).encode()
                  req = urllib.request.Request(url, data=body, method='POST', headers={
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                  })
                  try:
                      with urllib.request.urlopen(req, timeout=15) as response:
                          result = json.loads(response.read())
                      value = None
                      batches = result.get('result') or []
                      if batches and (batches[0].get('results') or []):
                          value = batches[0]['results'][0].get('count')
                      row['counts'][table] = value
                  except Exception as exc:
                      row['counts'][table] = {'unavailable': type(exc).__name__}
              report.append(row)
          (out / 'd1-counts.json').write_text(json.dumps(report, indent=2))
          PY

      - name: Create safe summary
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('production-diagnostic')
          summary = {'diagnostic': 'read-only', 'worker': 'joy-payroll'}
          for filename, key in [('credential-status.json','credentials'), ('worker-settings.json','worker_settings'), ('worker-deployments.json','worker_deployments'), ('d1-databases.json','d1_databases'), ('d1-counts.json','d1_counts')]:
              path = root / filename
              if not path.exists():
                  continue
              try:
                  data = json.loads(path.read_text())
              except Exception:
                  continue
              if key == 'worker_settings':
                  result = data.get('result') or {}
                  summary[key] = {
                      'success': data.get('success'),
                      'bindings': [
                          {'name': binding.get('name'), 'type': binding.get('type'), 'id': binding.get('id') or binding.get('database_id')}
                          for binding in (result.get('bindings') or [])
                      ],
                      'compatibility_date': result.get('compatibility_date'),
                  }
              elif key == 'worker_deployments':
                  deployments = data.get('result') or []
                  summary[key] = {
                      'success': data.get('success'),
                      'count': len(deployments),
                      'latest': deployments[0] if deployments else None,
                  }
              elif key == 'd1_databases':
                  dbs = data.get('result') or []
                  summary[key] = [{'name': db.get('name'), 'uuid': db.get('uuid') or db.get('id')} for db in dbs]
              else:
                  summary[key] = data
          (root / 'summary.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: joy-payroll-production-diagnostic
          path: production-diagnostic/summary.json
          if-no-files-found: error
          retention-days: 7
