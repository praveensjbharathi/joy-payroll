name: Validate Joy Payroll Production Release

on:
  push:
    branches:
      - release/production-excellence-v1
    paths-ignore:
      - production-diagnostic/last-run.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout protected release branch
        uses: actions/checkout@v4
        with:
          ref: release/production-excellence-v1

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Apply production safeguards
        id: safeguards
        continue-on-error: true
        run: npm run fix:production

      - name: Verify production acceptance requirements
        id: acceptance
        continue-on-error: true
        run: node --test tests/production-excellence.test.mjs

      - name: Run payroll regression tests
        id: regression
        continue-on-error: true
        run: node --import tsx --test tests/payroll-workflows.test.mjs tests/excel-import.test.mjs tests/payroll-enhancements.test.mjs

      - name: Prepare Supabase API
        id: supabase_prepare
        continue-on-error: true
        run: npm run prepare:supabase

      - name: Type-check Supabase application
        id: typecheck
        continue-on-error: true
        run: npx tsc --project tsconfig.supabase.json --noEmit

      - name: Verify Supabase deployment contract
        id: supabase_contract
        continue-on-error: true
        run: node --test tests/supabase-deployment.test.mjs tests/production-excellence.test.mjs

      - name: Build Cloudflare static application
        id: cloudflare_build
        continue-on-error: true
        run: npm run build:supabase

      - name: Prepare diagnostic directory
        run: mkdir -p production-diagnostic

      - name: Check Cloudflare credential availability
        id: credentials
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo '{"credentials":"available"}' > production-diagnostic/credential-status.json
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo '{"credentials":"missing"}' > production-diagnostic/credential-status.json
          fi

      - name: Read Worker deployment and binding metadata
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/workers/scripts/joy-payroll/settings" > production-diagnostic/worker-settings.json || true
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/workers/scripts/joy-payroll/deployments" > production-diagnostic/worker-deployments.json || true
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/d1/database?per_page=100" > production-diagnostic/d1-databases.json || true

      - name: Read-only D1 payroll table counts
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request
          out = pathlib.Path('production-diagnostic')
          token = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          account = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '')
          report = []
          try:
              payload = json.loads((out / 'd1-databases.json').read_text())
              databases = payload.get('result') or []
          except Exception as exc:
              (out / 'd1-counts.json').write_text(json.dumps({'error': type(exc).__name__}, indent=2))
              raise SystemExit(0)
          tables = ['employees', 'payroll_runs', 'payroll_items', 'recovery_finalizations', 'hostels', 'app_users']
          for database in databases:
              dbid = database.get('uuid') or database.get('id')
              name = database.get('name')
              if not dbid:
                  continue
              row = {'database_name': name, 'counts': {}}
              for table in tables:
                  url = f'https://api.cloudflare.com/client/v4/accounts/{account}/d1/database/{dbid}/query'
                  body = json.dumps({'sql': f'SELECT COUNT(*) AS count FROM {table}'}).encode()
                  req = urllib.request.Request(url, data=body, method='POST', headers={
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                  })
                  try:
                      with urllib.request.urlopen(req, timeout=15) as response:
                          result = json.loads(response.read())
                      batches = result.get('result') or []
                      value = None
                      if batches and (batches[0].get('results') or []):
                          value = batches[0]['results'][0].get('count')
                      row['counts'][table] = value
                  except Exception as exc:
                      row['counts'][table] = {'unavailable': type(exc).__name__}
              report.append(row)
          (out / 'd1-counts.json').write_text(json.dumps(report, indent=2))
          PY

      - name: Write safe validation summary
        env:
          INSTALL: ${{ steps.install.outcome }}
          SAFEGUARDS: ${{ steps.safeguards.outcome }}
          ACCEPTANCE: ${{ steps.acceptance.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          SUPABASE_PREPARE: ${{ steps.supabase_prepare.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          SUPABASE_CONTRACT: ${{ steps.supabase_contract.outcome }}
          CLOUDFLARE_BUILD: ${{ steps.cloudflare_build.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path('production-diagnostic')
          checks = {
              'npm_install': os.environ.get('INSTALL'),
              'production_safeguards': os.environ.get('SAFEGUARDS'),
              'acceptance_tests': os.environ.get('ACCEPTANCE'),
              'regression_tests': os.environ.get('REGRESSION'),
              'supabase_prepare': os.environ.get('SUPABASE_PREPARE'),
              'typescript': os.environ.get('TYPECHECK'),
              'supabase_contract': os.environ.get('SUPABASE_CONTRACT'),
              'cloudflare_build': os.environ.get('CLOUDFLARE_BUILD'),
          }
          summary = {
              'release': 'production-excellence-v1',
              'validation': checks,
              'all_code_checks_passed': all(value == 'success' for value in checks.values()),
              'cloudflare': {'diagnostic': 'read-only', 'worker': 'joy-payroll'},
          }
          credential = root / 'credential-status.json'
          if credential.exists():
              try:
                  summary['cloudflare']['credentials'] = json.loads(credential.read_text()).get('credentials')
              except Exception:
                  summary['cloudflare']['credentials'] = 'unknown'
          settings = root / 'worker-settings.json'
          if settings.exists():
              try:
                  data = json.loads(settings.read_text())
                  result = data.get('result') or {}
                  summary['cloudflare']['worker_settings_readable'] = data.get('success') is True
                  summary['cloudflare']['bindings'] = [
                      {'name': b.get('name'), 'type': b.get('type')}
                      for b in (result.get('bindings') or [])
                  ]
                  summary['cloudflare']['compatibility_date'] = result.get('compatibility_date')
              except Exception:
                  summary['cloudflare']['worker_settings_readable'] = False
          deployments = root / 'worker-deployments.json'
          if deployments.exists():
              try:
                  data = json.loads(deployments.read_text())
                  rows = data.get('result') or []
                  summary['cloudflare']['deployment_metadata_readable'] = data.get('success') is True
                  summary['cloudflare']['deployment_count_returned'] = len(rows)
              except Exception:
                  summary['cloudflare']['deployment_metadata_readable'] = False
          dbs = root / 'd1-databases.json'
          if dbs.exists():
              try:
                  data = json.loads(dbs.read_text())
                  rows = data.get('result') or []
                  summary['cloudflare']['d1_list_readable'] = data.get('success') is True
                  summary['cloudflare']['d1_databases'] = [db.get('name') for db in rows]
              except Exception:
                  summary['cloudflare']['d1_list_readable'] = False
          counts = root / 'd1-counts.json'
          if counts.exists():
              try:
                  summary['cloudflare']['d1_counts'] = json.loads(counts.read_text())
              except Exception:
                  pass
          (root / 'last-run.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY

      - name: Commit safe validation result to release branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production-diagnostic/last-run.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record production release validation result"
          git push origin HEAD:release/production-excellence-v1

      - name: Enforce validation result
        env:
          INSTALL: ${{ steps.install.outcome }}
          SAFEGUARDS: ${{ steps.safeguards.outcome }}
          ACCEPTANCE: ${{ steps.acceptance.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          SUPABASE_PREPARE: ${{ steps.supabase_prepare.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          SUPABASE_CONTRACT: ${{ steps.supabase_contract.outcome }}
          CLOUDFLARE_BUILD: ${{ steps.cloudflare_build.outcome }}
        shell: bash
        run: |
          for value in "$INSTALL" "$SAFEGUARDS" "$ACCEPTANCE" "$REGRESSION" "$SUPABASE_PREPARE" "$TYPECHECK" "$SUPABASE_CONTRACT" "$CLOUDFLARE_BUILD"; do
            test "$value" = "success" || exit 1
          done
