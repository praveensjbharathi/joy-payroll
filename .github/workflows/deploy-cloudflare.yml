name: Verify Joy Payroll Cloudflare Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: joy-payroll-cloudflare-build
  cancel-in-progress: true

jobs:
  verify-cloudflare-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Supabase frontend for Cloudflare
        run: npm run build:supabase

      - name: Confirm Cloudflare static output
        run: test -f dist-supabase/index.html
